<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; }
  body {
    background:
      radial-gradient(circle at 50% 42%, #1a2b23 0%, #14231c 55%, #0f1c16 100%);
    position: relative;
  }
  .glow {
    position: absolute; left: 50%; top: 50%; width: 780px; height: 780px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,231,168,.28) 0%, rgba(255,231,168,.10) 45%, transparent 68%);
  }
  .sign {
    position: absolute; left: 50%; top: 50%; width: 660px; height: 660px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 36% 30%, #5d8ea0 0%, #48788a 38%, #3f7080 62%, #35606f 82%, #2e5462 100%);
    border: 10px solid rgba(226,238,244,.4);
    box-shadow: 0 24px 80px rgba(0,0,0,.55), inset 0 10px 34px rgba(255,255,255,.14), inset 0 -30px 60px rgba(0,0,0,.35);
  }
  .sign::before {
    content: ""; position: absolute; inset: 26px; border-radius: 50%;
    border: 6px solid rgba(235,244,250,.28);
  }
  .bus {
    position: absolute; top: 76px; left: 50%; transform: translateX(-50%);
    font-size: 52px; opacity: .9; z-index: 3;
  }
  .toto {
    position: absolute; left: 50%; top: 148px; transform: translateX(-50%);
    width: 372px; height: 440px; z-index: 2;
  }
  .toto svg { width: 100%; height: 100%; display: block; }
</style>
</head>
